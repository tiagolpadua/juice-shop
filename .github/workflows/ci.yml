name: Continuous Integration (CI)

# on:
  # push:
  #   branches: [ master ]
  # pull_request:
  #   types: [opened, synchronize, reopened]
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better relevancy of analysis
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci --legacy-peer-deps
          
      - name: Run backend tests with coverage
        run: npm run test:server
        continue-on-error: true  # Continue even if tests fail to get coverage data
        
      - name: Run API tests with coverage
        run: npm run frisby
        continue-on-error: true  # Continue even if tests fail to get coverage data
        
      - name: Run frontend tests with coverage
        run: |
          cd frontend
          npm run test -- --watch=false --browsers=ChromiumHeadless --code-coverage=true
        continue-on-error: true  # Continue even if tests fail to get coverage data
        
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          
      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true  # Allow to continue for educational purposes
          
      - name: Comment PR with SonarQube results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const qualityGateStatus = '${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}';
            const projectKey = 'owasp-juice-shop';
            const sonarUrl = '${{ secrets.SONAR_HOST_URL }}';
            
            let comment = `## 📊 SonarQube Analysis Results
            
            **Quality Gate Status:** ${qualityGateStatus === 'PASSED' ? '✅ PASSED' : '❌ FAILED'}
            
            `;
            
            if (sonarUrl) {
              comment += `[📋 View detailed report on SonarQube](${sonarUrl}/dashboard?id=${projectKey})
              
              `;
            }
            
            if (qualityGateStatus !== 'PASSED') {
              comment += `⚠️ **Note**: This is an intentionally vulnerable application for security training. Some security issues are by design and should not be "fixed" unless specifically requested.
              
              `;
            }
            
            comment += `For more information about this educational project, visit: https://owasp-juice.shop`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            
      - name: Educational Notice
        if: steps.sonarqube-quality-gate-check.outputs.quality-gate-status != 'PASSED'
        run: |
          echo "ℹ️  EDUCATIONAL NOTICE:"
          echo "This is the OWASP Juice Shop - an intentionally vulnerable application"
          echo "Some code quality issues and security vulnerabilities are by design"
          echo "Quality gate failures in this context are expected and educational"
          echo "Only fix issues that are explicitly requested or unintentional"

      - name: Run TruffleHog
        id: trufflehog
        run: |
          docker run --rm -v "${{ github.workspace }}:/pwd" -w /pwd \
            trufflesecurity/trufflehog:latest \
            filesystem /pwd \
            --exclude-paths .trufflehogignore \
            --fail
          
      - name: Comment on PR if secrets found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `⚠️ **Security Alert: Secrets Detected**
            
            TruffleHog has detected potential secrets in this pull request. Please review and remove any exposed credentials before this PR can be merged.
            
            Common issues:
            - API keys or tokens
            - Database passwords
            - Private keys
            - Authentication credentials
            
            Please check the TruffleHog scan results in the GitHub Actions logs for specific details.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            
      - name: Fail if secrets detected
        if: failure()
        run: |
          echo "❌ TruffleHog detected secrets in the codebase"
          echo "This PR cannot be merged until all secrets are removed"
          exit 1