name: Continuous Integration (CI)

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  dependencies:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-hit }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better relevancy of analysis
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
          
      - name: Install backend dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install
        
      - name: Install frontend dependencies and build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: dependencies
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          
      - name: Run backend tests with coverage
        run: npm run test:server
        continue-on-error: true
        
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: build/reports/coverage/server-tests/
          retention-days: 1

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: dependencies
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          
      - name: Run frontend tests with coverage
        run: |
          cd frontend
          npm run test -- --watch=false --browsers=ChromiumHeadless --code-coverage=true
        continue-on-error: true
        
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 1

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: dependencies
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          
      - name: Run API tests with coverage
        run: npm run frisby
        continue-on-error: true
        
      - name: Upload API coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: build/reports/coverage/api-tests/
          retention-days: 1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run TruffleHog
        id: trufflehog
        run: |
          docker run --rm -v "${{ github.workspace }}:/pwd" -w /pwd \
            trufflesecurity/trufflehog:latest \
            filesystem /pwd \
            --exclude-paths .trufflehogignore
        continue-on-error: true

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, api-tests]
    if: always()  # Run even if some tests fail
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-reports
          
      - name: Restore coverage structure
        run: |
          mkdir -p build/reports/coverage/server-tests
          mkdir -p build/reports/coverage/api-tests
          mkdir -p frontend/coverage
          
          if [ -d "coverage-reports/backend-coverage" ]; then
            cp -r coverage-reports/backend-coverage/* build/reports/coverage/server-tests/ || true
          fi
          
          if [ -d "coverage-reports/api-coverage" ]; then
            cp -r coverage-reports/api-coverage/* build/reports/coverage/api-tests/ || true
          fi
          
          if [ -d "coverage-reports/frontend-coverage" ]; then
            cp -r coverage-reports/frontend-coverage/* frontend/coverage/ || true
          fi
          
      - name: SonarQube Scan
        if: false  # Temporarily disabled
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          
      - name: SonarQube Quality Gate check
        if: false  # Temporarily disabled
        id: sonarqube-quality-gate-check
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true
          
      - name: Comment PR with SonarQube results
        if: github.event_name == 'pull_request' && false  # Temporarily disabled
        uses: actions/github-script@v7
        with:
          script: |
            const qualityGateStatus = '${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}';
            const projectKey = 'tiagolpadua_juice-shop';
            const sonarUrl = '${{ secrets.SONAR_HOST_URL }}';
            
            let comment = `## 📊 SonarQube Analysis Results
            
            **Quality Gate Status:** ${qualityGateStatus === 'PASSED' ? '✅ PASSED' : '❌ FAILED'}
            
            `;
            
            if (sonarUrl) {
              comment += `[📋 View detailed report on SonarQube](${sonarUrl}/dashboard?id=${projectKey})
              
              `;
            }
            
            if (qualityGateStatus !== 'PASSED') {
              comment += `⚠️ **Note**: This is an intentionally vulnerable application for security training. Some security issues are by design and should not be "fixed" unless specifically requested.
              
              `;
            }
            
            comment += `For more information about this educational project, visit: https://owasp-juice.shop`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            
      - name: Educational Notice
        if: steps.sonarqube-quality-gate-check.outputs.quality-gate-status != 'PASSED'
        run: |
          echo "ℹ️  EDUCATIONAL NOTICE:"
          echo "This is the OWASP Juice Shop - an intentionally vulnerable application"
          echo "Some code quality issues and security vulnerabilities are by design"
          echo "Quality gate failures in this context are expected and educational"
          echo "Only fix issues that are explicitly requested or unintentional"
          
      - name: CI Summary
        run: |
          echo "## 🚀 CI Pipeline Summary"
          echo "✅ Dependencies installed and cached"
          echo "🧪 Tests executed in parallel:"
          echo "   - Backend tests: ${{ needs.backend-tests.result }}"
          echo "   - Frontend tests: ${{ needs.frontend-tests.result }}"
          echo "   - API tests: ${{ needs.api-tests.result }}"
          echo "🔒 Security scan completed"
          echo "📊 Quality gate analysis prepared"