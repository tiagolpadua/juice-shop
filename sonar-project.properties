# SonarQube Configuration for OWASP Juice Shop
sonar.projectKey=tiagolpadua_juice-shop
sonar.projectName=OWASP Juice Shop
sonar.projectVersion=18.0.0
sonar.organization=tiagolpadua

# Source code configuration
sonar.sources=.
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Test configuration
sonar.tests=test
sonar.test.inclusions=test/**/*.spec.ts,test/**/*.test.ts,frontend/src/**/*.spec.ts

# Coverage reports
sonar.typescript.lcov.reportPaths=build/reports/coverage/server-tests/lcov.info,frontend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=build/reports/coverage/api-tests/lcov.info

# Exclusions - Files and directories to exclude from analysis
sonar.exclusions=**/node_modules/**,\
                 **/build/**,\
                 **/dist/**,\
                 **/coverage/**,\
                 **/*.min.js,\
                 **/vendor/**,\
                 frontend/src/assets/**,\
                 data/static/codefixes/**,\
                 data/static/contractABIs.ts,\
                 frontend/src/assets/public/ContractABIs.ts,\
                 **/*.d.ts

# Test exclusions
sonar.test.exclusions=**/node_modules/**

# Quality gate - Adjusted for educational vulnerable application
# Note: This is an intentionally vulnerable application for security training
# Some security hotspots and vulnerabilities are by design and should not be "fixed"
sonar.qualitygate.wait=true

# Language-specific settings
sonar.typescript.node=node
sonar.typescript.file.suffixes=.ts,.tsx
sonar.javascript.file.suffixes=.js,.jsx

# Security hotspot rules - Some rules disabled for educational purposes
# sonar.security.hotspots.inheritance=NONE